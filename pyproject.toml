[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lingshu"
version = "0.0.1"
description = "灵枢 · 完整 AI 生命载体（灵×脑×身）——身体侧代码主体：存算一体 / 世界模型 / 自研神经网络 / 图像生成"
readme = "README.md"
# Python 下界＝**已测版本矩阵**的下界（README「代码主体」节：Python 3.12.x）——区间外未测不承诺。
# 原写 ">=3.10" 与本文件 extras 的下界冲突：numpy>=2.3.5 的 PyPI 元数据 requires_python 为 >=3.11
# （2.5.3 更是 >=3.12；2026-10-11 实测 pypi.org/pypi/numpy/<v>/json），3.10 环境装 `.[world]`
# 必然解析失败；且 CI 矩阵（gate.yml）只跑 3.12/3.13，从未覆盖 3.10/3.11。
# 故下界收到实测下界 3.12＝CI 的阻断档（tests/test_gate_python_floor_and_matrix.py 会核此一致性）。
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
# 轻核承诺：core 纯标准库（不装任何 extras 也可运行）
# 版本区间依据＝2026-10-08 实测矩阵（Python 3.12.x：numpy 2.3.5/2.4.2/2.5.3 · Pillow 12.2.0/12.3.0），
# 区间外未测不承诺；矩阵与说明见 README「代码主体」节（外部报告 issue #4）。
# world 的「常规路径」含渲染：4 个 `render()` 在函数内 `from PIL import Image`
# （skeleton3d.py:128 / silhouette3d.py:154 / scene_model.py:234,263 / world3d.py:374），
# 故 `.[world]` 必须带 Pillow——否则装上 world 也画不出图（#253；README「代码主体」节
# 已把 `.[full]` 的常规路径写成「含 numpy / Pillow」）。
world = ["numpy>=2.3.5,<2.6", "Pillow>=12.2,<13"]
nn = ["numpy>=2.3.5,<2.6", "Pillow>=12.2,<13"]
gen = ["numpy>=2.3.5,<2.6", "Pillow>=12.2,<13"]
full = ["numpy>=2.3.5,<2.6", "Pillow>=12.2,<13"]
# —— 可选重载 sub-extra（#253）：这些依赖**只在单个函数内**按需 import（缺则调用点
#    ImportError），且体积/实测成本大 ⇒ **不进 full**（CI 装 `.[full,dev]`，不该被
#    GB 级 torch 拖垮）。此前它们在本文件**完全没有声明面** ⇒ 装 `.[full,dev]` 后
#    调用这些函数必 `ModuleNotFoundError`（#253 的第二半）：
#      · core-sparse    ← core/activation.py:56 `from scipy.sparse import csr_matrix`
#                          （可选稀疏后端；缺则降级 edge-list，见 intake v0.1 依赖表）
#      · nn-train       ← nn/hex_train.py:40 `import pyarrow.parquet as pq`（parquet 语料加载）
#      · gen-diffusion  ← gen/hexgen_multi_seed.py:88-89 `import torch` /
#                          `from diffusers import QwenImage21Pipeline`（黑箱多 seed 渲染）
#    命名约定：`<层>-<用途>`——守卫 tests/test_issue253_extras_declared_guard.py 按
#    「层 extra ∪ 该层的 `层-*` sub-extra」判定该层第三方导入是否有声明面。
#    版本区间：core-sparse 的 numpy 沿用已测矩阵；scipy/pyarrow/torch/diffusers **未入**
#    README「已测版本矩阵」，故如实**不设区间**（要设区间须先补实测矩阵）。
#    判据来源＝经验标定（#253），追不到更早出处。
core-sparse = ["numpy>=2.3.5,<2.6", "scipy"]
nn-train = ["pyarrow"]
gen-diffusion = ["torch", "diffusers"]
# dev = 开发/测试面：pytest（运行器）+ PyYAML（**测试件的运行依赖**）。
#   PyYAML 之所以落 dev 而非新建 tools extra / 不入 full：tools/ 不进 wheel
#   （本文件 packages.find 只收 lingshu*），该依赖只在「本仓开发：跑本仓测试 / 驱动 tools/」
#   场景下被拉起——tests/test_coggraph_public_paths.py 子进程调用 tools/coggraph/export_coggraph.py，
#   后者**模块级 `import yaml`**；此前只写进 tools/coggraph/README.md 散文未进声明面 ⇒
#   门禁装 `.[full,dev]` 拿不到 PyYAML，出现「本机装了 PyYAML 而绿 / CI 红」的回归。
#   `pytest-xdist` 同理落 dev：它只是**并行跑**同一套测试的加速器（本机实测
#   全量 483s → 176s，`-n 4 --dist loadfile`），不引入任何运行时依赖。
dev = ["pytest", "PyYAML>=6.0,<7", "pytest-xdist>=3.6,<4", "markdown-it-py"]
#   ^ #604 守卫（tests/test_issue604_repro_html_end_guard.py）的渲染真值对表依赖：
#     importorskip 守卫的**测试件运行依赖**（与 PyYAML 同形入 dev）；不设版本区间——
#     markdown-it-py 未入 README「已测版本矩阵」（与 scipy/torch 的「要设区间先补实测」口径同）。

[tool.setuptools.packages.find]
include = ["lingshu*"]

[tool.setuptools.package-data]
# nn 模块附属固化物（白箱固化产物，JSON 可直读；见 docs/intake/body-export-v0.2/）
"lingshu.nn" = ["assets/*.json"]
